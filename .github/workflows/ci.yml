name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela el CI anterior de la misma rama: ahorra minutos
# y evita que 5 personas se hagan cola entre sí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"

jobs:
  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm fe:lint
      - run: pnpm fe:typecheck
      - run: pnpm fe:test
      - run: pnpm fe:build

  backend:
    name: Backend (build, tests, ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/backend
      - name: Build
        working-directory: apps/backend
        # `build` incluye los tests unitarios y ArchUnit.
        # Los de integración (Testcontainers) van en su propio job.
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-backend
          path: apps/backend/**/build/reports/

  integration:
    name: Integración (Testcontainers)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/backend
      - name: Tests de integración
        working-directory: apps/backend
        # Incluye el test de aislamiento entre tenants (CU-02).
        run: ./gradlew integrationTest --no-daemon

  contract:
    name: Contrato API sincronizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:lint
      - name: ¿El contrato y el cliente generado divergieron?
        run: pnpm api:check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:install
      - name: Levantar el sistema completo
        run: |
          cp .env.example .env
          docker compose --env-file .env \
            -f infra/docker/compose.yml \
            -f infra/docker/compose.full.yml up -d --build --wait
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Análisis de calidad ──────────────────────────────────────
  # DESHABILITADO por defecto y ejecutable a mano (workflow_dispatch).
  # SonarQube corre en UNA sola máquina y con cadencia baja: cinco
  # instancias producen cinco historiales y ninguna métrica confiable,
  # porque Sonar mide TENDENCIA sobre código nuevo. Ver plan §8.1.
  sonar:
    name: SonarQube (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo "Ejecutar desde la máquina de calidad con 'pnpm sonar'."
