name: Ticket delivery

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  format-and-evidence:
    name: Ticket metadata and evidence
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch, Jira traceability, and test evidence
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const branchPattern = /^(feat|fix|docs|chore)\/([^/]+)\/((?:HU-\d+\.\d+|HUT-\d+(?:\.\d+)?|MAP-\d+|CU-\d{2}))-([a-z0-9]+(?:-[a-z0-9]+)*)$/i;
            const branchMatch = branch.match(branchPattern);
            if (!branchMatch) {
              core.setFailed(`Branch must follow <type>/<github-handle>/<ticket-id>-<ticket-slug>; received: ${branch}`);
              return;
            }

            const [, , branchHandle, branchTicket, branchSlug] = branchMatch;
            const pullRequestAuthor = pr.user.login;
            if (branchHandle.toLowerCase() !== pullRequestAuthor.toLowerCase()) {
              core.setFailed(`Branch handle ${branchHandle} must match the pull request author ${pullRequestAuthor}.`);
              return;
            }

            const titleMatch = pr.title.match(/^\s*(HU-\d+\.\d+|HUT-\d+(?:\.\d+)?|MAP-\d+|CU-\d{2})\s+\u2014\s+(.+?)\s*$/i);
            if (!titleMatch || titleMatch[1].toLowerCase() !== branchTicket.toLowerCase()) {
              core.setFailed('PR title must use "<ticket-id> — <exact ticket name>" and match the ID in the branch.');
              return;
            }

            const titleSlug = titleMatch[2]
              .normalize('NFD')
              .replace(/\p{Diacritic}/gu, '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '');
            if (titleSlug !== branchSlug.toLowerCase()) {
              core.setFailed('Branch slug must preserve the full ticket name used in the PR title.');
              return;
            }

            const body = pr.body ?? '';
            const jiraLink = body.match(/https:\/\/matiasmv2005\.atlassian\.net\/browse\/(MAP-\d+)/i);
            if (!jiraLink) {
              core.setFailed('PR description must include a clickable Jira issue link.');
              return;
            }

            const baseLine = body.match(/Rama base:\s*`?([^`\r\n]+)`?/i);
            if (!baseLine || baseLine[1].trim().startsWith('<') || baseLine[1].trim() !== pr.base.ref) {
              core.setFailed(`PR description must list the actual base branch (${pr.base.ref}).`);
              return;
            }

            const summary = body.match(/##\s*Qué hace este PR\s*([\s\S]*?)(?=\n##|$)/i)?.[1]?.trim() ?? '';
            if (!summary || summary.startsWith('<') || summary.length > 400) {
              core.setFailed('Add a brief one- or two-sentence PR description under “Qué hace este PR”.');
              return;
            }

            core.info('Branch, handle, title, slug, Jira link, base branch, and summary are present.');
