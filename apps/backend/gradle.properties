# =============================================================
#  Flags del build. Best practice de Gradle:
#  "Set Build Flags in gradle.properties" y
#  "Do Not Use gradle.properties in Subprojects" (solo este, en la raíz).
# =============================================================

# ── Rendimiento ──────────────────────────────────────────────
org.gradle.caching=true
# Desactivado: el plugin de Flyway (org.flywaydb.gradle) invoca `Task.project`
# en tiempo de ejecución, algo incompatible con el Configuration Cache desde
# Gradle 9. Reactivar cuando el plugin lo soporte. Ver:
# https://github.com/flyway/flyway/issues/3550
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ── Codificación consistente entre SO ────────────────────────
# Sin esto, un mismo archivo compila distinto en Windows y en Linux.
systemProp.file.encoding=UTF-8

# ── Spring Boot ──────────────────────────────────────────────
# Reinicio en caliente durante `bootRun`.
spring.devtools.restart.enabled=true
