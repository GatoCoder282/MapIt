# =============================================================
#  MapIt — configuración base del backend
#  Los valores sensibles llegan por variables de entorno (.env de la raíz).
# =============================================================

spring:
  application:
    name: mapit-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mapit}
    username: ${POSTGRES_USER:mapit}
    password: ${POSTGRES_PASSWORD:changeme_local}
    hikari:
      maximum-pool-size: 10
      pool-name: mapit-pool

  # ── Migraciones ───────────────────────────────────────────
  # Flyway crea y evoluciona el esquema. Ver plan §7.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      # `validate`, NUNCA `update` ni `create`.
      # Hibernate solo VERIFICA que las entidades coinciden con el esquema
      # que aplicó Flyway, y falla el arranque si divergen. Es la red que
      # detecta "añadí un campo y olvidé la migración" en 2 segundos.
      ddl-auto: validate
    open-in-view: false # evita consultas perezosas fuera de la transacción
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    # OJO (Spring Boot 4 = Jackson 3): NO existe
    #   spring.jackson.serialization.write-dates-as-timestamps
    # `WRITE_DATES_AS_TIMESTAMPS` salió de SerializationFeature y ahora vive en
    # DateTimeFeature. Ponerla aquí impide que la aplicación arranque.
    # No hace falta declararla: Jackson 3 ya serializa las fechas como ISO-8601
    # por defecto, que es justo lo que queremos.

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  threads:
    virtual:
      enabled: true # Java 25: hilos virtuales para las peticiones

# ── Servidor ────────────────────────────────────────────────
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── Configuración propia de MapIt ───────────────────────────
mapit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_min_32_chars_long_0123456789}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  tenant:
    resolution-strategy: ${TENANT_RESOLUTION_STRATEGY:jwt-claim}
    header-name: ${TENANT_HEADER_NAME:X-Tenant-Id}
    default: ${TENANT_DEFAULT:demo}
  unleash:
    url: ${UNLEASH_URL:http://localhost:4242/api}
    api-token: ${UNLEASH_API_TOKEN:default:development.unleash-insecure-api-token}
    app-name: ${UNLEASH_APP_NAME:mapit-backend}
    environment: ${UNLEASH_ENVIRONMENT:development}
    # Si Unleash no responde, se usan los valores por defecto de FeatureFlag.
    # La aplicación NUNCA debe caerse porque el servidor de flags esté abajo.
    fail-open: true
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    api-key: ${PAYMENT_API_KEY:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

# ── Observabilidad ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ── Documentación de API ────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.mapit: DEBUG
    org.springframework.web: INFO
