<section class="business-types" id="negocios" aria-labelledby="business-title">
  <div class="section-inner">
    <header class="section-header">
      <div class="section-badge">
        {{ strings.landing.businessTypes.badge }}
      </div>
      <h2 id="business-title" class="section-title">{{ strings.landing.businessTypes.title }}</h2>
      <p class="section-subtitle">{{ strings.landing.businessTypes.subtitle }}</p>
    </header>

    <!-- Visual de Tenants (reemplaza los grids anteriores) -->
    <div class="tenants-visual">
      <img
        ngSrc="assets/img/Tenants.jpg"
        [alt]="strings.landing.businessTypes.visualAlt"
        class="tenants-img"
        width="900"
        height="159"
      />
    </div>
  </div>
</section>
