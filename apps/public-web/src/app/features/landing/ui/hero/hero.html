<section class="hero" id="producto" aria-labelledby="hero-title">
  <div class="hero-inner">
    <!-- Contenido izquierdo -->
    <div class="hero-content">
      <!-- Badge -->
      <div class="hero-badge" aria-label="Categoría">
        <span class="badge-dot" aria-hidden="true"></span>
        Gestión espacial en tiempo real
      </div>

      <!-- Título principal -->
      <h1 id="hero-title" class="hero-title">
        Mapea tu negocio.<br />
        <span class="hero-title-accent">Opéralo en tiempo real.</span>
      </h1>

      <!-- Descripción -->
      <p class="hero-description">
        Convierte tu espacio físico en un mapa digital interactivo para gestionar disponibilidad, reservas y operación
        desde un solo lugar.
      </p>

      <!-- CTAs -->
      <div class="hero-ctas">
        <a href="#contacto" class="btn-primary">
          Solicitar acceso
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="btn-arrow">
            <path
              fill-rule="evenodd"
              d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <a href="#como-funciona" class="btn-ghost">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
            class="play-icon"
          >
            <circle cx="12" cy="12" r="10" />
            <polygon points="10 8 16 12 10 16 10 8" />
          </svg>
          Ver cómo funciona
        </a>
      </div>

      <!-- Feature badges -->
      <div class="hero-features" role="list">
        <div class="feature-badge" role="listitem">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="feature-icon">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          En tiempo real
        </div>
        <div class="feature-badge" role="listitem">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
            class="feature-icon"
          >
            <rect x="2" y="3" width="5" height="10" rx="1" />
            <rect x="9" y="3" width="5" height="10" rx="1" />
          </svg>
          Multi-negocio
        </div>
        <div class="feature-badge" role="listitem">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
            class="feature-icon"
          >
            <path d="M3 8l3 3 7-7" />
          </svg>
          Fácil de usar
        </div>
      </div>
    </div>

    <!-- Mockup del producto -->
    <div class="hero-visual" aria-label="Vista previa de la aplicación MapIt" role="img">
      <img
        ngSrc="assets/img/mockup_app.png"
        alt="Vista previa de la aplicación MapIt"
        class="app-mockup-img"
        width="2100"
        height="630"
        priority
      />
    </div>
  </div>
</section>
