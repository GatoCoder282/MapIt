<section class="editor-section" [attr.aria-label]="strings.landing.editor.aria">
  <div class="editor-inner">
    <div class="editor-copy">
      <h2 class="section-title">
        {{ strings.landing.editor.titleA }}<br />
        <span class="title-accent">{{ strings.landing.editor.titleB }}</span>
      </h2>
      <p class="section-description">{{ strings.landing.editor.subtitle }}</p>
    </div>
    <div class="editor-visual-wrapper">
      <img
        ngSrc="assets/img/Herramientas.png"
        [alt]="strings.landing.editor.visualAlt"
        class="editor-tools-img"
        width="2465"
        height="811"
      />
    </div>
  </div>
</section>
