<section class="steps-section" id="como-reservar" aria-labelledby="steps-title">
  <div class="inner">
    <header class="head">
      <h2 id="steps-title">
        {{ strings.reservas.steps.title }} <span>{{ strings.reservas.steps.titleAccent }}</span>
      </h2>
      <p>{{ strings.reservas.steps.subtitle }}</p>
    </header>
    <ol class="steps">
      @for (step of steps(); track step.title; let i = $index) {
        <li class="step" mapitReveal [mapitRevealDelay]="i * 60">
          <span class="step-icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              @switch (i) {
                @case (0) {
                  <circle cx="10.5" cy="10.5" r="7" />
                  <path d="m16 16 5 5" />
                }
                @case (1) {
                  <rect x="3" y="5" width="18" height="16" rx="2" />
                  <path d="M3 10h18M7 2v6M17 2v6" />
                }
                @case (2) {
                  <path d="m4 12 5 5L20 6" />
                }
              }</svg
          ></span>
          <h3>{{ i + 1 }}. {{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
