<!-- El gráfico es un canvas: el nombre accesible lo pone el módulo de aria
     de ECharts (`options.aria.description`) y los valores de cada semana siguen
     disponibles en la tabla de abajo, invisible para el ojo. -->
<div class="chart" echarts [options]="options()" [theme]="theme"></div>

<div class="labels" [class.dense]="dense()" aria-hidden="true">
  @for (point of series(); track $index) {
    <span>{{ point.label }}</span>
  }
</div>

@if (isEmpty()) {
  <p class="empty-note">{{ emptyText() }}</p>
}

<!-- El canvas no puede ser la única vía de acceso al dato (design-guidelines.md):
     los valores de cada semana viven también en esta tabla, invisible para el ojo. -->
<table class="sr-only">
  <caption>
    {{
      strings.chartDataCaption
    }}
  </caption>
  <thead>
    <tr>
      <th scope="col">{{ strings.chartDataPeriod }}</th>
      <th scope="col">{{ strings.chartDataValue }}</th>
    </tr>
  </thead>
  <tbody>
    @for (point of series(); track $index) {
      <tr>
        <th scope="row">{{ point.label }}</th>
        <td>{{ point.value }}</td>
      </tr>
    }
  </tbody>
</table>
