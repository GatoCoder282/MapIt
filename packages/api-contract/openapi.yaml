        del proyecto). El estado no viaja aquí: su transición auditada es de HU-3.01.
      operationId: updateSpaceElement
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceElementUpdateRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
