    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [spaces]
      summary: Crear un sector
      description: Crea un nuevo sector para un piso específico. El slug se autogenera y se valida su unicidad.
      operationId: createSector
      security: [] # Temporary
      requestBody:
        required: true
        content:
