openapi: 3.1.0

info:
  title: MapIt API
  version: 0.1.0
  description: |
    API de MapIt — motor de gestión espacial multi-tenant.

    **Este archivo es la fuente de verdad del contrato.** Se edita ANTES de escribir
    código, y de él se generan:
      - el cliente TypeScript que consume Angular (`libs/api-client`)
      - las interfaces Java que los `@RestController` deben implementar

    Consecuencia: si alguien cambia el contrato sin actualizar este archivo,
    el build de Java falla porque el controlador ya no implementa la interfaz.
    El contrato lo hace cumplir el compilador, no la convención.

    Regenerar con `pnpm api:gen`; verificar que no hay drift con `pnpm api:check`.

  contact:
    name: Equipo MapIt
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
  - url: /api/v1
    description: Relativo (contenedor)

tags:
  - name: auth
    description: Autenticación del staff de cada tenant
  - name: users
    description: Alta de usuarios de staff (CU-25)
  - name: health
    description: Estado del servicio
  - name: tenants
    description: Registro de empresas de la plataforma
  - name: feature-flags
    description: Feature toggles evaluados para el contexto actual
  - name: demo-items
    description: CRUD de demostración para validar la integración Angular + Spring Boot
  - name: establishments
    description: Establecimientos de un tenant (CU-04)
  - name: spaces
    description: Gestión de pisos y sectores (CU-05)
  - name: operations
    description: Operación en vivo de elementos espaciales (CU-09)

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      description: |
        Verifica las credenciales del usuario dentro del tenant indicado y emite
        un token de acceso JWT. Todos los rechazos de credenciales usan el mismo
        mensaje para no revelar si existen el tenant o la cuenta.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales válidas y token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      tags: [health]
      summary: Estado del servicio
      description: Endpoint de humo. Sirve para verificar que el contrato de punta a punta funciona.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: El servicio está operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      tags: [tenants]
      summary: Listar tenants de la plataforma
      description: |
        Operación exclusiva de SUPER_ADMIN. La tabla `tenant` es global de la
        plataforma (sin `tenant_id` ni RLS, por diseño — ver ADR-0004): el
        aislamiento multi-tenant NO aplica aquí y esta es la única sección de
        la API que ve todos los tenants. El backend la protege con el rol, no
        solo el frontend.
      operationId: listTenants
      parameters:
        - name: search
          in: query
          description: Filtra por nombre o slug (contiene, sin distinguir mayúsculas).
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TenantStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [tenants]
      summary: Registrar un tenant
      description: |
        Registra una nueva empresa en la plataforma. La operación pertenece al
        Administrador de Plataforma y genera el identificador del tenant en el backend.
        El correo del administrador se usa para enviar la confirmación y no se devuelve
        como parte del recurso tenant.
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
      responses:
        "201":
          description: Tenant creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Identificador del tenant (cadena generada por el backend).
        schema:
          type: string
          minLength: 2
          maxLength: 63

    get:
      tags: [tenants]
      summary: Consultar el detalle de un tenant
      description: Solo SUPER_ADMIN. 404 si no existe.
      operationId: getTenant
      responses:
        "200":
          description: Tenant solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [tenants]
      summary: Editar un tenant
      description: |
        Edición parcial: solo `name` y `status`. `slug` y `vertical` no están
        en el esquema a propósito: son inmutables por dominio (el slug vive en
        URLs públicas de login y reserva; la vertical se asigna al crear y
        condiciona el onboarding). Enviarlos queda fuera del esquema.

        `status` implementa el ciclo de vida de CU-03: ACTIVE ↔ SUSPENDED.
        NO existe DELETE: el negocio suspende, no elimina.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdateRequest"
      responses:
        "200":
          description: Tenant actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/activate:
    post:
      tags: [auth]
      summary: Activar la cuenta del primer ADMIN de un tenant
      description: |
        Onboarding de CU-25: el invitado abre el enlace que recibió por correo y
        define su contraseña. Público (aún no existe sesión). Jamás viaja una
        contraseña temporal ni un JWT: el enlace lleva un token opaco aleatorio
        de un solo uso con caducidad de 24 h; en el servidor solo se guarda su
        hash SHA-256.

        Errores específicos (todos `application/problem+json`):
        - `invitation-invalid`   — el token no existe o está mal formado
        - `invitation-expired`   — el token existe pero caducó
        - `invitation-used`      — el token ya se consumió
        - `password-mismatch`    — password y su confirmación difieren
        - `password-weak`        — no cumple las reglas de contraseña
      operationId: activateAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: Cuenta ADMIN creada y activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    post:
      tags: [users]
      summary: Crear un usuario de staff
      description: |
        Creación de cuentas de staff (CU-25 / MAP-185). Autorización exacta:

        - **SUPER_ADMIN**: puede crear `ADMIN`, `MANAGER` o `STAFF`, y debe indicar
          el tenant destino con `tenantSlug` (su sesión pertenece al tenant técnico
          `platform`, no a un negocio).
        - **ADMIN**: solo puede crear `STAFF` y siempre dentro de su propio tenant;
          si envía `tenantSlug` distinto del suyo, recibe 403.
        - **MANAGER** y **STAFF**: 403.

        El `tenant_id` nunca se acepta como dato del cliente: sale del JWT (o del
        slug indicado por el SUPER_ADMIN, que sí puede operar cross-tenant).
        El correo es único por tenant; un duplicado responde 409. Nunca se devuelve
        ni persiste una contraseña temporal en claro, ni se genera un JWT aquí.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuario creado y activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /feature-flags:
    get:
      tags: [feature-flags]
      summary: Flags evaluadas para el usuario y tenant actuales
      description: |
        Devuelve el estado de las feature flags ya evaluadas en el contexto del
        llamante (tenant, usuario, rol, país). El frontend no evalúa reglas:
        solo consume booleanos.

        Nota: para el navegador, la vía preferente es el **unleash-proxy**
        (`UNLEASH_PROXY_URL`). Este endpoint existe para diagnóstico y para
        clientes que ya están autenticados contra el backend.
      operationId: getFeatureFlags
      responses:
        "200":
          description: Mapa de flag → habilitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlags"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /demo-items:
    get:
      tags: [demo-items]
      summary: Listar elementos de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: listDemoItems
      security: []
      responses:
        "200":
          description: Elementos del tenant de demostración
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoItem"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [demo-items]
      summary: Crear un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: createDemoItem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoItemRequest"
      responses:
        "201":
          description: Elemento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /demo-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento
        schema:
          type: string
          format: uuid

    get:
      tags: [demo-items]
      summary: Obtener un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: getDemoItem
      security: []
      responses:
        "200":
          description: Elemento solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [demo-items]
      summary: Actualizar un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: updateDemoItem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoItemRequest"
      responses:
        "200":
          description: Elemento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [demo-items]
      summary: Eliminar un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: deleteDemoItem
      security: []
      responses:
        "204":
          description: Elemento eliminado
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Establecimientos (CU-04) ────────────────────────────────────────────────
  # `security: []` es TEMPORAL, igual que en demo-items: la autenticación JWT
  # llega en CU-23/CU-24 y hasta entonces el tenant se resuelve en el servidor
  # con el adaptador `DemoTenantContext`. El tenant NUNCA viaja en el cuerpo.
  /establishments:
    get:
      tags: [establishments]
      summary: Listar los establecimientos del tenant
      description: Devuelve solo los establecimientos vivos del tenant del contexto.
      operationId: listEstablishments
      security: []
      responses:
        "200":
          description: Establecimientos del tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [establishments]
      summary: Registrar un establecimiento
      description: El identificador lo genera el backend; el tenant sale del contexto.
      operationId: createEstablishment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentCreateRequest"
      responses:
        "201":
          description: Establecimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /establishments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del establecimiento
        schema:
          type: string
          format: uuid

    get:
      tags: [establishments]
      summary: Obtener un establecimiento
      description: Responde 404 si no existe o pertenece a otro tenant.
      operationId: getEstablishment
      security: []
      responses:
        "200":
          description: Establecimiento solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [establishments]
      summary: Actualizar un establecimiento
      description: |
        El tipo NO viaja en el cuerpo: es inmutable tras la creación (RN-3), porque
        cambiarlo invalidaría las plantillas de elemento de CU-07 y los mapas ya
        dibujados. El contrato lo hace cumplir antes que cualquier validación en Java.
      operationId: updateEstablishment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentUpdateRequest"
      responses:
        "200":
          description: Establecimiento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [establishments]
      summary: Dar de baja un establecimiento
      description: |
        Baja LÓGICA: la fila se conserva con `deleted_at` informado. No aparece en las
        consultas y su slug queda libre para reutilizarse.
      operationId: deleteEstablishment
      security: []
      responses:
        "204":
          description: Establecimiento dado de baja
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Pisos (CU-05) ────────────────────────────────────────────────
  # `security: []` es TEMPORAL, igual que en demo-items: la autenticación JWT
  # llega en CU-23/CU-24 y hasta entonces el tenant se resuelve en el servidor
  # con el adaptador `DemoTenantContext`. El tenant NUNCA viaja en el cuerpo.
  /floors:
    get:
      tags: [spaces]
      summary: Listar todos los pisos del tenant
      description: Devuelve todos los pisos del tenant actual (resuelto desde el JWT).
      operationId: listFloors
      security: [] # Temporary
      responses:
        "200":
          description: Lista de pisos del tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Floor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [spaces]
      summary: Crear un piso
      description: Crea un nuevo piso para el tenant actual. El slug se autogenera y se valida su unicidad. Se asocia al establecimiento por defecto del tenant.
      operationId: createFloorForTenant
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorCreateRequest"
      responses:
        "201":
          description: Piso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /establishments/{establishmentId}/floors:
    parameters:
      - name: establishmentId
        in: path
        required: true
        description: Identificador del establecimiento
        schema:
          type: string
          format: uuid
    get:
      tags: [spaces]
      summary: Listar los pisos de un establecimiento
      description: Devuelve todos los pisos asociados a un establecimiento específico.
      operationId: listFloorsByEstablishment
      security: [] # Temporary
      responses:
        "200":
          description: Lista de pisos para el establecimiento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Floor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [spaces]
      summary: Crear un piso
      description: Crea un nuevo piso para un establecimiento específico. El slug se autogenera y se valida su unicidad.
      operationId: createFloor
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorCreateRequest"
      responses:
        "201":
          description: Piso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /floors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del piso
        schema:
          type: string
          format: uuid
    get:
      tags: [spaces]
      summary: Obtener un piso
      description: Devuelve un piso específico por su ID.
      operationId: getFloor
      security: [] # Temporary
      responses:
        "200":
          description: Piso solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [spaces]
      summary: Actualizar un piso
      description: Actualiza un piso existente. El slug no se puede modificar.
      operationId: updateFloor
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorCreateRequest"
      responses:
        "200":
          description: Piso actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [spaces]
      summary: Eliminar un piso
      description: Elimina un piso (soft delete).
      operationId: deleteFloor
      security: [] # Temporary
      responses:
        "204":
          description: Piso eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Sectores (CU-05) ────────────────────────────────────────────────
  # `security: []` es TEMPORAL, igual que en demo-items: la autenticación JWT
  # llega en CU-23/CU-24 y hasta entonces el tenant se resuelve en el servidor
  # con el adaptador `DemoTenantContext`. El tenant NUNCA viaja en el cuerpo.
  /floors/{floorId}/sectors:
    parameters:
      - name: floorId
        in: path
        required: true
        description: Identificador del piso al que pertenece el sector
        schema:
          type: string
          format: uuid
    get:
      tags: [spaces]
      summary: Listar los sectores de un piso
      description: Devuelve todos los sectores asociados a un piso específico.
      operationId: listSectorsByFloor
      security: [] # Temporary
      responses:
        "200":
          description: Lista de sectores para el piso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # If floorId doesn't exist
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [spaces]
      summary: Crear un sector
      description: Crea un nuevo sector para un piso específico. El slug se autogenera y se valida su unicidad.
      operationId: createSector
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorCreateRequest"
      responses:
        "201":
          description: Sector creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "400":
          $ref: "#/components/responses/BadRequest" # Validation errors (e.g., name too long)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # If floorId doesn't exist
        "409":
          $ref: "#/components/responses/Conflict" # If generated slug conflicts
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Elementos espaciales (HU-2.03 / CU-08) ────────────────────────────────
  # `security: []` es TEMPORAL, igual que en establishments/floors/sectors: la
  # autenticación JWT llega en CU-23/CU-24 y hasta entonces el tenant se resuelve con
  # `DemoTenantContext`. El tenant NUNCA viaja en el cuerpo y el sector del path se
  # re-verifica contra el tenant de la petición.
  /sectors/{sectorId}/elements:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenecen los elementos
        schema:
          type: string
          format: uuid
    get:
      tags: [spaces]
      summary: Listar los elementos espaciales de un sector
      description: Devuelve solo los elementos vivos del sector, dentro del tenant actual.
      operationId: listSpaceElementsBySector
      security: [] # Temporary
      responses:
        "200":
          description: Lista de elementos del sector
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceElement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # If sectorId doesn't exist or is another tenant's
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [spaces]
      summary: Crear un elemento espacial
      description: |
        Registra un elemento dentro de un sector del tenant actual. El tipo debe ser
        coherente con la vertical del establecimiento (`ROOM` solo en hotel, `SEAT` solo en
        salón de eventos, el resto en cualquiera). Las coordenadas son relativas al sector
        y no pueden ser negativas.
      operationId: createSpaceElement
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceElementCreateRequest"
      responses:
        "201":
          description: Elemento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceElement"
        "400":
          $ref: "#/components/responses/BadRequest" # Tipo/estado inválido, coords negativas, vertical incompatible
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # Si el sector no existe o es de otro tenant
        "500":
          $ref: "#/components/responses/ServerError"

  /sectors/{sectorId}/elements/{elementId}:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenece el elemento
        schema:
          type: string
          format: uuid
      - name: elementId
        in: path
        required: true
        description: Identificador del elemento espacial
        schema:
          type: string
          format: uuid
    get:
      tags: [spaces]
      summary: Obtener un elemento espacial
      description: Responde 404 si no existe, está dado de baja o es de otro sector/tenant.
      operationId: getSpaceElement
      security: [] # Temporary
      responses:
        "200":
          description: Elemento solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceElement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [spaces]
      summary: Actualizar un elemento espacial
      description: |
        Reemplaza tipo y coordenadas (semántica PUT de reemplazo completo, como el resto
        del proyecto). El estado no viaja aquí: su transición auditada es de HU-3.01.
      operationId: updateSpaceElement
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceElementUpdateRequest"
      responses:
        "200":
          description: Elemento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceElement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /sectors/{sectorId}/elements/{elementId}/state:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenece el elemento
        schema:
          type: string
          format: uuid
      - name: elementId
        in: path
        required: true
        description: Identificador del elemento espacial cuyo estado se actualiza
        schema:
          type: string
          format: uuid
    patch:
      tags: [operations]
      summary: Actualizar el estado operativo de un elemento espacial
      description: |
        Cambia el estado de un elemento vivo del tenant autenticado. El tenant se obtiene
        exclusivamente del claim `tenant` del JWT. Un elemento inexistente, dado de baja,
        de otro sector o de otro tenant responde siempre `404`. Una transición fuera de la
        máquina de estados operativa responde `409` sin modificar ni auditar el elemento.
      operationId: updateSpaceElementState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceElementStateUpdateRequest"
      responses:
        "200":
          description: Estado actualizado o confirmado de forma idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceElementStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /sectors/{sectorId}/elements/{elementId}/state-history:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenece el elemento
        schema:
          type: string
          format: uuid
      - name: elementId
        in: path
        required: true
        description: Identificador del elemento espacial cuyo historial se consulta
        schema:
          type: string
          format: uuid
    get:
      tags: [operations]
      summary: Consultar el historial de estados de un elemento espacial
      description: |
        Devuelve la trazabilidad persistente del elemento, de la más reciente a la más
        antigua. El tenant se obtiene exclusivamente del JWT y un elemento ajeno responde
        `404`, igual que uno inexistente.
      operationId: listSpaceElementStateChanges
      responses:
        "200":
          description: Historial de cambios del elemento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceElementStateChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por `/auth/login`. Incluye el claim `tenant`, que es de
        donde el backend resuelve el tenant (NO del header `X-Tenant-Id`, que el
        cliente podría falsificar).

  schemas:
    LoginRequest:
      type: object
      required: [tenantSlug, email, password]
      properties:
        tenantSlug:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          const: Bearer
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
        user:
          $ref: "#/components/schemas/AuthenticatedUser"

    AuthenticatedUser:
      type: object
      required: [id, tenantId, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          minLength: 2
          maxLength: 63
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: string
          readOnly: true
        role:
          $ref: "#/components/schemas/UserRole"

    CreateUserRequest:
      type: object
      required: [email, fullName, password, role]
      properties:
        tenantSlug:
          type: string
          description: |
            Solo para SUPER_ADMIN: tenant destino. Para ADMIN/MANAGER/STAFF el
            tenant sale del JWT y este campo se rechaza si no coincide.
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        role:
          type: string
          description: Rol a crear. SUPER_ADMIN nunca puede crearse por API.
          enum: [ADMIN, MANAGER, STAFF]

    CreatedUser:
      type: object
      required: [id, tenantId, email, fullName, role, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: string
          readOnly: true
        role:
          $ref: "#/components/schemas/UserRole"
        active:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    ActivationRequest:
      type: object
      required: [tenantSlug, token, password, passwordConfirm]
      properties:
        tenantSlug:
          type: string
          description: |
            Slug del tenant, incluido en el enlace del correo. Permite acotar la
            búsqueda a un tenant bajo RLS real: un slug manipulado con un token
            válido simplemente no encuentra la invitación (no hay bypass).
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        token:
          type: string
          description: Token opaco del enlace de invitación; nunca se persiste en claro.
          minLength: 32
          maxLength: 200
          writeOnly: true
        password:
          type: string
          description: Contraseña elegida por el invitado. Reglas de CU-25.
          minLength: 8
          maxLength: 128
          writeOnly: true
        passwordConfirm:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    ActivationResponse:
      type: object
      required: [tenantSlug, email]
      properties:
        tenantSlug:
          type: string
          readOnly: true
          description: Slug del tenant activado, para redirigir a `/empresa/{slug}/login`.
        email:
          type: string
          format: email
          readOnly: true

    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, MANAGER, STAFF]

    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          examples: [UP]
        version:
          type: string
          examples: ["0.1.0"]
        timestamp:
          type: string
          format: date-time

    FeatureFlags:
      type: object
      description: Clave de flag (`<dominio>.<feature>`) → si está habilitada.
      additionalProperties:
        type: boolean
      examples:
        - demo.hello: true
          payments.qr: false
          realtime.websocket: true

    BusinessVertical:
      type: string
      description: Vertical de negocio inicial del tenant.
      enum: [RESTAURANT, NIGHTCLUB, EVENT_HALL, HOTEL]

    Tenant:
      type: object
      required: [id, name, slug, vertical, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Identificador único generado por el backend.
          minLength: 2
          maxLength: 63
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        vertical:
          $ref: "#/components/schemas/BusinessVertical"
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TenantRequest:
      type: object
      required: [name, slug, vertical, administratorEmail]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        vertical:
          $ref: "#/components/schemas/BusinessVertical"
        administratorEmail:
          type: string
          format: email
          maxLength: 254

    TenantStatus:
      type: string
      description: Ciclo de vida del tenant (CU-03). El negocio suspende; no hay borrado físico.
      enum: [ACTIVE, SUSPENDED]

    TenantPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    TenantUpdateRequest:
      type: object
      description: |
        Edición parcial (PATCH). Solo `name` y `status` son editables.
        `slug` y `vertical` están ausentes deliberadamente: son inmutables
        por dominio. Al menos un campo debe venir informado.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/TenantStatus"

    DemoItem:
      type: object
      required: [id, name, description, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    DemoItemRequest:
      type: object
      required: [name, description, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean

    EstablishmentType:
      type: string
      description: |
        Tipo de establecimiento. Coincide en valores con `BusinessVertical`, pero se
        declara aparte a propósito: es un concepto del contexto `spaces` (decide qué
        plantillas de elemento aplican en CU-07), y compartir el esquema acoplaría
        `spaces` a `platform`.
      enum: [RESTAURANT, NIGHTCLUB, EVENT_HALL, HOTEL]

    Establishment:
      type: object
      description: |
        `deletedAt` y `deletedBy` no se exponen: las consultas solo devuelven filas
        vivas, así que siempre serían nulos. Son detalle interno de persistencia.
      required: [id, name, type, slug, timezone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/EstablishmentType"
        slug:
          type: string
          description: Identificador en la URL pública de reserva (CU-15).
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: string
          description: Dirección física del establecimiento (opcional).
          maxLength: 200
        timezone:
          type: string
          description: Identificador IANA de zona horaria.
          maxLength: 64
          examples: ["America/La_Paz"]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: [string, "null"]
          format: uuid
          description: Nulo hasta CU-23/CU-24, cuando exista `app_user`.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: [string, "null"]
          format: uuid
          description: Nulo hasta CU-23/CU-24, cuando exista `app_user`.
          readOnly: true

    EstablishmentCreateRequest:
      type: object
      required: [name, type, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/EstablishmentType"
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: string
          description: Dirección física del establecimiento (opcional).
          maxLength: 200
        timezone:
          type: string
          description: Si se omite, el backend aplica America/La_Paz.
          maxLength: 64
          examples: ["America/La_Paz"]

    EstablishmentUpdateRequest:
      type: object
      description: |
        Sin `type` a propósito: el tipo es inmutable tras la creación (RN-3). Si el
        cliente lo envía, queda fuera del esquema y se rechaza.
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: [string, "null"]
          description: Dirección física (null la borra).
          maxLength: 200
        timezone:
          type: string
          maxLength: 64
          examples: ["America/La_Paz"]

    Floor:
      type: object
      required: [id, name, slug, level, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
          readOnly: true
        level:
          type: integer
          minimum: 0
          maximum: 999
        establishmentId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    FloorCreateRequest:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        level:
          type: integer
          minimum: 0
          maximum: 999

    Sector:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100 # Corrected
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    SectorCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100 # Corrected
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63

    # ── Elementos espaciales (HU-2.03) ──────────────────────────────────────
    SpaceElement:
      type: object
      required: [id, sectorId, type, x, y, state, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sectorId:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
          description: Catálogo cerrado del modelo propio (ADR-0006). La validez por vertical la verifica el servidor.
        x:
          type: number
          format: double
          minimum: 0
          description: Coordenada horizontal relativa al sector.
        y:
          type: number
          format: double
          minimum: 0
          description: Coordenada vertical relativa al sector.
        state:
          type: string
          enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
          readOnly: true
          description: Estado operativo actual (las transiciones auditadas son de HU-3.01).
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    SpaceElementCreateRequest:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0
        initialState:
          type: string
          enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
          default: AVAILABLE

    SpaceElementUpdateRequest:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0

    SpaceElementStateUpdateRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/SpaceElementOperationalState"

    SpaceElementStateResponse:
      type: object
      required: [id, sectorId, state, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sectorId:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    SpaceElementOperationalState:
      type: string
      enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
      description: Estado operativo actual de un elemento espacial.

    SpaceElementStateChange:
      type: object
      required: [id, elementId, previousState, newState, changedBy, changedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        elementId:
          type: string
          format: uuid
          readOnly: true
        previousState:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        newState:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        changedBy:
          type: string
          format: uuid
          readOnly: true
          description: Usuario autenticado que realizó el cambio.
        changedAt:
          type: string
          format: date-time
          readOnly: true

    # RFC 9457 — Problem Details. Spring 6+ lo soporta de forma nativa,
    # así que todos los errores de la API usan este formato.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          examples: ["Unauthorized"]
        status:
          type: integer
          examples: [401]
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    Unauthorized:
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: La solicitud no cumple las validaciones
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: El recurso entra en conflicto con otro existente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: No se pudo completar una dependencia externa
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: Error inesperado del servidor
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Autenticado, pero sin permiso para este recurso o tenant
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe (o pertenece a otro tenant)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

security:
  - bearerAuth: []
