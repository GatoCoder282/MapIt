          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict" # Tiene reservas activas
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Layout de sector (HU-4.01) ─────────────────────────────────────────
  # Guardado por lotes de la distribución interna: dimensiones del sector +
  # geometría de sus elementos, transaccional y con concurrencia optimista.
  /sectors/{sectorId}/layout:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector cuyo layout se guarda
        schema:
          type: string
          format: uuid
    put:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [spaces]
      summary: Guardar el layout de un sector (por lotes)
      description: |
        Guardado transaccional de la distribución interna (RN-7): dimensiones
        intrínsecas del sector + geometría de sus elementos. Nunca toca el
        `state` operativo (RN-9). Cada recurso lleva su `updatedAt` observado;
        conflicto → 409 con la lista de recursos que cambiaron.
      operationId: saveSectorLayout
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorLayoutUpdateRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Layout del sector guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorLayoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Geometría inválida o elemento fuera del sector
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /sectors/{sectorId}/elements/{elementId}/state:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenece el elemento
        schema:
          type: string
          format: uuid
      - name: elementId
        in: path
        required: true
        description: Identificador del elemento espacial cuyo estado se actualiza
        schema:
          type: string
          format: uuid
    patch:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [operations]
      summary: Actualizar el estado operativo de un elemento espacial
      description: |
        Cambia el estado de un elemento vivo del tenant autenticado. El tenant se obtiene
        exclusivamente del claim `tenant` del JWT. Un elemento inexistente, dado de baja,
        de otro sector o de otro tenant responde siempre `404`. Una transición fuera de la
        máquina de estados operativa responde `409` sin modificar ni auditar el elemento.
      operationId: updateSpaceElementState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceElementStateUpdateRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Estado actualizado o confirmado de forma idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceElementStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /sectors/{sectorId}/elements/{elementId}/state-history:
    parameters:
      - name: sectorId
        in: path
        required: true
        description: Identificador del sector al que pertenece el elemento
        schema:
          type: string
          format: uuid
      - name: elementId
        in: path
        required: true
        description: Identificador del elemento espacial cuyo historial se consulta
        schema:
          type: string
          format: uuid
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [operations]
      summary: Consultar el historial de estados de un elemento espacial
      description: |
        Devuelve la trazabilidad persistente del elemento, de la más reciente a la más
        antigua. El tenant se obtiene exclusivamente del JWT y un elemento ajeno responde
        `404`, igual que uno inexistente.
      operationId: listSpaceElementStateChanges
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Historial de cambios del elemento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceElementStateChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /element-states/summary:
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [operations]
      summary: Resumen de los estados operativos de los elementos del tenant
      description: |
        Recuento agregado de los elementos espaciales vivos del tenant autenticado,
        agrupados por su estado operativo, más el total. El tenant se obtiene
        exclusivamente del claim `tenant` del JWT; los elementos dados de baja no se
        cuentan. Las cinco claves de estado están siempre presentes (con 0 cuando no
        hay elementos en ese estado) para que el cliente no trate claves ausentes.
      operationId: summarizeSpaceElementStates
      security: []
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Recuento de elementos por estado operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementStateSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===== ELEMENT TEMPLATES (HU-4.02 / CU-07) =====

  /element-templates:
    get:
      tags: [templates]
      summary: Listar plantillas de elemento
      description: |
        Devuelve todas las plantillas activas del tenant autenticado, ordenadas por nombre.
        El tenant se obtiene del claim `tenant` del JWT.
      operationId: listElementTemplates
      responses:
        "200":
          description: Lista de plantillas del tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElementTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [templates]
      summary: Crear plantilla de elemento
      description: |
        Crea una nueva plantilla con nombre y tipo. El nombre debe ser único dentro del tenant
        (case-insensitive). Un nombre duplicado devuelve `409`.
      operationId: createElementTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementTemplateCreateRequest"
      responses:
        "201":
          description: Plantilla creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /element-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        description: Identificador de la plantilla
        schema:
          type: string
          format: uuid
    get:
      tags: [templates]
      summary: Obtener una plantilla
      description: Responde 404 si no existe, está dada de baja o es de otro tenant.
      operationId: getElementTemplate
      responses:
        "200":
          description: Plantilla solicitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [templates]
      summary: Actualizar una plantilla
      description: |
        Reemplaza nombre y tipo de la plantilla (PUT completo). Un nombre ya usado por otra
        plantilla viva del tenant devuelve `409`.
      operationId: updateElementTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementTemplateUpdateRequest"
      responses:
        "200":
          description: Plantilla actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [templates]
      summary: Dar de baja una plantilla
      description: |
        Baja lógica: la plantilla deja de aparecer en el listado, pero su histórico
        se conserva. No se puede deshacer.
      operationId: deleteElementTemplate
      responses:
        "204":
          description: Plantilla dada de baja
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Identificador opcional de correlación de la petición. El servidor acepta
        UUID de cualquier versión con formato hexadecimal 8-4-4-4-12 y los
        normaliza a minúsculas; si falta o es inválido, genera otro sin rechazar
        la petición. El esquema admite texto para permitir esa sustitución.
        No autentica al cliente ni determina el tenant.
      schema:
        type: string
      example: "c1b3ad60-64d2-4a6b-a94e-7a43251c3fab"

  headers:
    RequestId:
      description: |
        UUID en minúsculas de correlación aceptado o generado por el servidor, también en
        respuestas de error. Disponible para el navegador mediante CORS.
      required: true
      schema:
        type: string
        format: uuid
      example: "c1b3ad60-64d2-4a6b-a94e-7a43251c3fab"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por `/auth/login`. Incluye el claim `tenant`, que es de
        donde el backend resuelve el tenant (NO del header `X-Tenant-Id`, que el
        cliente podría falsificar).

  schemas:
    AuditResourceType:
      type: string
      enum: [RESERVATION, SPACE_ELEMENT]

    AuditEventType:
      type: string
      enum: [RESERVATION_CREATED, RESERVATION_STATUS_CHANGED, SPACE_ELEMENT_STATE_CHANGED]

    AuditLogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - actorId
        - occurredAt
        - resourceType
        - resourceId
        - eventType
        - details
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actorId:
          type: string
          format: uuid
          readOnly: true
        occurredAt:
          type: string
          format: date-time
          readOnly: true
        resourceType:
          $ref: "#/components/schemas/AuditResourceType"
        resourceId:
          type: string
          format: uuid
          readOnly: true
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        details:
          type: object
          additionalProperties:
            type: string
          readOnly: true

    AuditLogPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    PublicAvailability:
      type: object
      required: [establishmentId, date, elements]
      additionalProperties: false
      description: Disponibilidad pública mínima para un establecimiento y día local.
      properties:
        establishmentId:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        elements:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityElement"

    PublicAvailabilityElement:
      type: object
      required: [id, type]
      additionalProperties: false
      description: Proyección pública de un elemento espacial reservable.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM]

    PublicReservationCreateRequest:
      type: object
      required: [date, startTime, endTime, spaceElementIds, customer]
      additionalProperties: false
      description: Reserva anónima con fecha y horas locales del establecimiento.
      properties:
        date:
          type: string
          format: date
          description: Día local del establecimiento (YYYY-MM-DD).
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Hora local de inicio (HH:mm).
          examples: ["20:00"]
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Hora local de fin (HH:mm), posterior al inicio.
          examples: ["22:00"]
        spaceElementIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        customer:
          $ref: "#/components/schemas/PublicCustomer"

    PublicCustomer:
      type: object
      required: [fullName, email]
      additionalProperties: false
      description: Datos mínimos del cliente final que crea la reserva.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 32

    PublicReservation:
      type: object
      required:
        - id
        - establishmentId
        - spaceElementIds
        - date
        - startTime
        - endTime
        - startsAt
        - endsAt
        - timezone
        - status
        - createdAt
      additionalProperties: false
      description: Confirmación pública sin datos personales ni auditoría del actor.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        establishmentId:
          type: string
          format: uuid
          readOnly: true
        spaceElementIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          readOnly: true
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          readOnly: true
        startsAt:
          type: string
          format: date-time
          readOnly: true
        endsAt:
          type: string
          format: date-time
          readOnly: true
        timezone:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/ReservationStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    Reservation:
      type: object
      required:
        - id
        - establishmentId
        - personId
        - spaceElementIds
        - startsAt
        - endsAt
        - status
        - createdAt
        - createdBy
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        establishmentId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        spaceElementIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ReservationStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          format: uuid
          readOnly: true

    ReservationCreateRequest:
      type: object
      required: [personId, spaceElementIds, startsAt, endsAt]
      properties:
        personId:
          type: string
          format: uuid
        spaceElementIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    ReservationStatus:
      type: string
      enum: [CREATED, CONFIRMED, ACTIVE, RELEASED, CANCELLED]

    Person:
      type: object
      required: [id, fullName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fullName:
          type: string
          maxLength: 120
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 32
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: [string, "null"]
          format: uuid
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: [string, "null"]
          format: uuid
          readOnly: true

    PersonCreateRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 32

    LoginRequest:
      type: object
      required: [tenantSlug, email, password]
      properties:
        tenantSlug:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          const: Bearer
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
        user:
          $ref: "#/components/schemas/AuthenticatedUser"

    AuthenticatedUser:
      type: object
      required: [id, tenantId, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          minLength: 2
          maxLength: 63
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: string
          readOnly: true
        role:
          $ref: "#/components/schemas/UserRole"

    CreateUserRequest:
      type: object
      required: [email, fullName, password, role]
      properties:
        tenantSlug:
          type: string
          description: |
            Solo para SUPER_ADMIN: tenant destino. Para ADMIN/MANAGER/STAFF el
            tenant sale del JWT y este campo se rechaza si no coincide.
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        role:
          type: string
          description: Rol a crear. SUPER_ADMIN nunca puede crearse por API.
          enum: [ADMIN, MANAGER, STAFF]

    CreatedUser:
      type: object
      required: [id, tenantId, email, fullName, role, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: string
          readOnly: true
        role:
          $ref: "#/components/schemas/UserRole"
        active:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    ActivationRequest:
      type: object
      required: [tenantSlug, token, password, passwordConfirm]
      properties:
        tenantSlug:
          type: string
          description: |
            Slug del tenant, incluido en el enlace del correo. Permite acotar la
            búsqueda a un tenant bajo RLS real: un slug manipulado con un token
            válido simplemente no encuentra la invitación (no hay bypass).
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        token:
          type: string
          description: Token opaco del enlace de invitación; nunca se persiste en claro.
          minLength: 32
          maxLength: 200
          writeOnly: true
        password:
          type: string
          description: Contraseña elegida por el invitado. Reglas de CU-25.
          minLength: 8
          maxLength: 128
          writeOnly: true
        passwordConfirm:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    ActivationResponse:
      type: object
      required: [tenantSlug, email]
      properties:
        tenantSlug:
          type: string
          readOnly: true
          description: Slug del tenant activado, para redirigir a `/empresa/{slug}/login`.
        email:
          type: string
          format: email
          readOnly: true

    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, MANAGER, STAFF]

    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          examples: [UP]
        version:
          type: string
          examples: ["0.1.0"]
        timestamp:
          type: string
          format: date-time

    FeatureFlags:
      type: object
      description: Clave de flag (`<dominio>.<feature>`) → si está habilitada.
      additionalProperties:
        type: boolean
      examples:
        - demo.hello: true
          payments.qr: false
          realtime.websocket: true

    BusinessVertical:
      type: string
      description: Vertical de negocio inicial del tenant.
      enum: [RESTAURANT, NIGHTCLUB, EVENT_HALL, HOTEL]

    Tenant:
      type: object
      required: [id, name, slug, vertical, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Identificador único generado por el backend.
          minLength: 2
          maxLength: 63
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        vertical:
          $ref: "#/components/schemas/BusinessVertical"
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TenantRequest:
      type: object
      required: [name, slug, vertical, administratorEmail]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        vertical:
          $ref: "#/components/schemas/BusinessVertical"
        administratorEmail:
          type: string
          format: email
          maxLength: 254

    TenantStatus:
      type: string
      description: Ciclo de vida del tenant (CU-03). El negocio suspende; no hay borrado físico.
      enum: [ACTIVE, SUSPENDED]

    TenantPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    TenantUpdateRequest:
      type: object
      description: |
        Edición parcial (PATCH). Solo `name` y `status` son editables.
        `slug` y `vertical` están ausentes deliberadamente: son inmutables
        por dominio. Al menos un campo debe venir informado.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/TenantStatus"

    DemoItem:
      type: object
      required: [id, name, description, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    DemoItemRequest:
      type: object
      required: [name, description, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean

    EstablishmentType:
      type: string
      description: |
        Tipo de establecimiento. Coincide en valores con `BusinessVertical`, pero se
        declara aparte a propósito: es un concepto del contexto `spaces` (decide qué
        plantillas de elemento aplican en CU-07), y compartir el esquema acoplaría
        `spaces` a `platform`.
      enum: [RESTAURANT, NIGHTCLUB, EVENT_HALL, HOTEL]

    Establishment:
      type: object
      description: |
        `deletedAt` y `deletedBy` no se exponen: las consultas solo devuelven filas
        vivas, así que siempre serían nulos. Son detalle interno de persistencia.
      required: [id, name, type, slug, timezone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/EstablishmentType"
        slug:
          type: string
          description: Identificador en la URL pública de reserva (CU-15).
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: string
          description: Dirección física del establecimiento (opcional).
          maxLength: 200
        timezone:
          type: string
          description: Identificador IANA de zona horaria.
          maxLength: 64
          examples: ["America/La_Paz"]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: [string, "null"]
          format: uuid
          description: Nulo hasta CU-23/CU-24, cuando exista `app_user`.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: [string, "null"]
          format: uuid
          description: Nulo hasta CU-23/CU-24, cuando exista `app_user`.
          readOnly: true

    EstablishmentCreateRequest:
      type: object
      required: [name, type, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/EstablishmentType"
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: string
          description: Dirección física del establecimiento (opcional).
          maxLength: 200
        timezone:
          type: string
          description: Si se omite, el backend aplica America/La_Paz.
          maxLength: 64
          examples: ["America/La_Paz"]

    EstablishmentUpdateRequest:
      type: object
      description: |
        Sin `type` a propósito: el tipo es inmutable tras la creación (RN-3). Si el
        cliente lo envía, queda fuera del esquema y se rechaza.
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
        address:
          type: [string, "null"]
          description: Dirección física (null la borra).
          maxLength: 200
        timezone:
          type: string
          maxLength: 64
          examples: ["America/La_Paz"]

    Floor:
      type: object
      required: [id, name, slug, level, createdAt, updatedAt, canvasWidth, canvasHeight]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
          readOnly: true
        level:
          type: integer
          minimum: 0
          maximum: 999
        establishmentId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        canvasWidth:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 1200
          readOnly: true
          description: Ancho del lienzo rectangular de la planta (HU-4.01). Se escribe vía `saveFloorLayout`.
        canvasHeight:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 800
          readOnly: true
          description: Alto del lienzo rectangular de la planta (HU-4.01). Se escribe vía `saveFloorLayout`.

    FloorCreateRequest:
      description: >-
        Alta/edición de piso. El `level` lo asigna siempre el servidor: los
        niveles son consecutivos empezando en 0 (siguiente = max actual + 1) y
        no son editables; el orden lo define el nivel, no el cliente.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Sector:
      type: object
      required: [id, name, slug, createdAt, updatedAt, x, y, rotation, width, height]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100 # Corrected
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        x:
          type: number
          format: double
          minimum: 0
          default: 0
          readOnly: true
          description: Colocación horizontal del sector dentro del lienzo de la planta (HU-4.01). Se escribe vía `saveFloorLayout`.
        y:
          type: number
          format: double
          minimum: 0
          default: 0
          readOnly: true
          description: Colocación vertical del sector dentro del lienzo de la planta (HU-4.01). Se escribe vía `saveFloorLayout`.
        rotation:
          type: number
          format: double
          default: 0
          readOnly: true
          description: Rotación del sector en grados dentro de la planta (HU-4.01).
        width:
          type: number
          format: double
          minimum: 20
          default: 800
          readOnly: true
          description: Dimensión intrínseca del sector (origen de coordenadas de sus elementos). Se escribe vía `saveSectorLayout`.
        height:
          type: number
          format: double
          minimum: 20
          default: 600
          readOnly: true
          description: Dimensión intrínseca del sector (origen de coordenadas de sus elementos). Se escribe vía `saveSectorLayout`.

    SectorCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100 # Corrected
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63

    # ── Elementos espaciales (HU-2.03) ──────────────────────────────────────
    SpaceElement:
      type: object
      required: [id, sectorId, type, x, y, width, height, rotation, state, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sectorId:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
          description: Catálogo cerrado del modelo propio (ADR-0006). La validez por vertical la verifica el servidor.
        x:
          type: number
          format: double
          minimum: 0
          description: Coordenada horizontal relativa al sector.
        y:
          type: number
          format: double
          minimum: 0
          description: Coordenada vertical relativa al sector.
        width:
          type: number
          format: double
          minimum: 20
          description: Ancho del elemento.
        height:
          type: number
          format: double
          minimum: 20
          description: Alto del elemento.
        rotation:
          type: number
          format: double
          default: 0
          description: Rotación en grados.
        state:
          type: string
          enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
          readOnly: true
          description: Estado operativo actual (las transiciones auditadas son de HU-3.01).
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # ── Layouts HU-4.01 (lectura agregada y guardados por lotes) ─────────
    SectorLayoutSector:
      description: Sector con su colocación en la planta y sus elementos (solo lectura).
      type: object
      required: [id, name, x, y, rotation, width, height, updatedAt, elements]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        x:
          type: number
          format: double
          minimum: 0
          description: Colocación horizontal dentro del lienzo de la planta.
        y:
          type: number
          format: double
          minimum: 0
          description: Colocación vertical dentro del lienzo de la planta.
        rotation:
          type: number
          format: double
          default: 0
        width:
          type: number
          format: double
          minimum: 20
          description: Dimensión intrínseca del sector.
        height:
          type: number
          format: double
          minimum: 20
          description: Dimensión intrínseca del sector.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        elements:
          type: array
          description: Elementos del sector en solo-lectura (RN-3, misma fila).
          items:
            $ref: "#/components/schemas/SpaceElement"

    FloorLayoutResponse:
      description: Planta con su lienzo, sus sectores colocados y sus elementos.
      type: object
      required: [floor, sectors]
      properties:
        floor:
          $ref: "#/components/schemas/Floor"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorLayoutSector"

    SectorPlacementUpdate:
      description: Colocación de un sector dentro de la planta (vista de planta, RN-6).
      type: object
      additionalProperties: false
      required: [id, x, y, rotation, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0
        rotation:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
          description: Marca observada al cargar; conflicto si la fila cambió (RN-7).

    FloorLayoutUpdateRequest:
      description: >-
        Guardado transaccional de la planta: dimensiones del lienzo + colocaciones
        de sectores. Todo o nada; concurrencia optimista por `updatedAt`.
      type: object
      additionalProperties: false
      required: [floor, sectors]
      properties:
        floor:
          type: object
          additionalProperties: false
          required: [canvasWidth, canvasHeight, updatedAt]
          properties:
            canvasWidth:
              type: number
              format: double
              exclusiveMinimum: 0
            canvasHeight:
              type: number
              format: double
              exclusiveMinimum: 0
            updatedAt:
              type: string
              format: date-time
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorPlacementUpdate"

    SectorLayoutUpdateRequest:
      description: >-
        Guardado transaccional de la distribución interna del sector: dimensiones
        del sector + geometría de sus elementos. Nunca toca `state` (RN-9).
      type: object
      additionalProperties: false
      required: [sector, elements]
      properties:
        sector:
          type: object
          additionalProperties: false
          required: [width, height, updatedAt]
          properties:
            width:
              type: number
              format: double
              minimum: 20
            height:
              type: number
              format: double
              minimum: 20
            updatedAt:
              type: string
              format: date-time
        elements:
          type: array
          items:
            $ref: "#/components/schemas/SectorLayoutElementUpdate"

    SectorLayoutElementUpdate:
      description: Geometría de un elemento dentro de su sector (vista de sector, RN-2).
      type: object
      additionalProperties: false
      required: [id, x, y, width, height, rotation, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0
        width:
          type: number
          format: double
          minimum: 20
        height:
          type: number
          format: double
          minimum: 20
        rotation:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time

    SectorLayoutResponse:
      description: Sector con su geometría actualizada y sus elementos vivos.
      type: object
      required: [sector, elements]
      properties:
        sector:
          $ref: "#/components/schemas/Sector"
        elements:
          type: array
          items:
            $ref: "#/components/schemas/SpaceElement"

    SectorDuplicateRequest:
      description: >-
        Duplicar un sector del mismo tenant hacia el piso del path (RN-5): crea
        sector y elementos con identificadores nuevos. Sin enlace origen→copia.
      type: object
      additionalProperties: false
      required: [sourceSectorId]
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: Sector a duplicar (mismo tenant; ajeno → 404).
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Si se omite, deriva "<nombre> (copia)".
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          minLength: 2
          maxLength: 63
          description: Si se omite, deriva del nombre asegurando unicidad en el piso destino.

    SpaceElementCreateRequest:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0
        width:
          type: number
          format: double
          minimum: 20
        height:
          type: number
          format: double
          minimum: 20
        rotation:
          type: number
          format: double
          default: 0
        initialState:
          type: string
          enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
          default: AVAILABLE

    SpaceElementUpdateRequest:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
        x:
          type: number
          format: double
          minimum: 0
        y:
          type: number
          format: double
          minimum: 0
        width:
          type: number
          format: double
          minimum: 20
        height:
          type: number
          format: double
          minimum: 20
        rotation:
          type: number
          format: double
          default: 0

    SpaceElementStateUpdateRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/SpaceElementOperationalState"

    SpaceElementStateResponse:
      type: object
      required: [id, sectorId, state, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sectorId:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    SpaceElementOperationalState:
      type: string
      enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
      description: Estado operativo actual de un elemento espacial.

    SpaceElementStateChange:
      type: object
      required: [id, elementId, previousState, newState, changedBy, changedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        elementId:
          type: string
          format: uuid
          readOnly: true
        previousState:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        newState:
          $ref: "#/components/schemas/SpaceElementOperationalState"
        changedBy:
          type: string
          format: uuid
          readOnly: true
          description: Usuario autenticado que realizó el cambio.
        changedAt:
          type: string
          format: date-time
          readOnly: true

    ElementStateSummary:
      type: object
      required: [total, byState]
      description: |
        Recuento agregado de los elementos espaciales vivos del tenant por estado
        operativo (sin los dados de baja). Las cinco claves están siempre presentes.
      properties:
        total:
          type: integer
          minimum: 0
          description: |
            Elementos vivos del tenant: la suma de los cinco estados, incluidos los
            fuera de servicio. Solo se excluyen los elementos dados de baja
            lógicamente (`deleted_at`).
        byState:
          type: object
          required: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
          properties:
            AVAILABLE: { type: integer, minimum: 0 }
            OCCUPIED: { type: integer, minimum: 0 }
            RESERVED: { type: integer, minimum: 0 }
            CLEANING: { type: integer, minimum: 0 }
            OUT_OF_SERVICE: { type: integer, minimum: 0 }

    # RFC 9457 — Problem Details. Spring 6+ lo soporta de forma nativa,
    # así que todos los errores de la API usan este formato.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          examples: ["Unauthorized"]
        status:
          type: integer
          examples: [401]
        detail:
          type: string
        instance:
          type: string
          format: uri

    ElementTemplate:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      description: Plantilla de configuración de un SpaceElement (HU-4.02)
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Mesa redonda 6 pax"]
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
          examples: ["TABLE"]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ElementTemplateCreateRequest:
      type: object
      required: [name, type]
      description: Cuerpo para crear una plantilla de elemento
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Mesa redonda 6 pax"]
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
          examples: ["TABLE"]

    ElementTemplateUpdateRequest:
      type: object
      required: [name, type]
      description: Cuerpo para actualizar una plantilla de elemento (PUT completo)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Mesa redonda 6 pax - actualizado"]
        type:
          type: string
          enum: [TABLE, BAR, SECTOR_ZONE, STAGE, SEAT, ROOM, DECOR]
          examples: ["BAR"]

  responses:
    Unauthorized:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: La solicitud no cumple las validaciones
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: El recurso entra en conflicto con otro existente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: No se pudo completar una dependencia externa
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: Error inesperado del servidor
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: Autenticado, pero sin permiso para este recurso o tenant
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      description: El recurso no existe (o pertenece a otro tenant)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

security:
  - bearerAuth: []
