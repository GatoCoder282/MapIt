openapi: 3.1.0

info:
  title: MapIt API
  version: 0.1.0
  description: |
    API de MapIt — motor de gestión espacial multi-tenant.

    **Este archivo es la fuente de verdad del contrato.** Se edita ANTES de escribir
    código, y de él se generan:
      - el cliente TypeScript que consume Angular (`libs/api-client`)
      - las interfaces Java que los `@RestController` deben implementar

    Consecuencia: si alguien cambia el contrato sin actualizar este archivo,
    el build de Java falla porque el controlador ya no implementa la interfaz.
    El contrato lo hace cumplir el compilador, no la convención.

    Regenerar con `pnpm api:gen`; verificar que no hay drift con `pnpm api:check`.

  contact:
    name: Equipo MapIt
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
  - url: /api/v1
    description: Relativo (contenedor)

tags:
  - name: auth
    description: Autenticación del staff de cada tenant
  - name: users
    description: Alta de usuarios de staff (CU-25)
  - name: health
    description: Estado del servicio
  - name: tenants
    description: Registro de empresas de la plataforma
  - name: feature-flags
    description: Feature toggles evaluados para el contexto actual
  - name: demo-items
    description: CRUD de demostración para validar la integración Angular + Spring Boot
  - name: establishments
    description: Establecimientos de un tenant (CU-04)
  - name: spaces
    description: Gestión de pisos y sectores (CU-05)
  - name: operations
    description: Operación en vivo de elementos espaciales (CU-09)
  - name: templates
    description: Plantillas de configuración de elementos espaciales (CU-07 / HU-4.02)
  - name: people
    description: Clientes del tenant usados en reservas (CU-11)
  - name: reservations
    description: Reservas internas asociadas a clientes y elementos espaciales (CU-12)
  - name: audit
    description: Bitácora inmutable de eventos de negocio del tenant (HU-5.03)
  - name: public-availability
    description: Consulta anónima de disponibilidad para el portal público (HU-6.01)
  - name: public-reservations
    description: Reserva anónima desde el portal público (HU-6.02)

paths:
  /public/tenants/{tenantSlug}/establishments/{establishmentSlug}/availability:
    get:
      tags: [public-availability]
      summary: Consultar disponibilidad pública
      description: |
        Devuelve los elementos activos, reservables y operativamente disponibles que no
        tienen una reserva vigente durante la fecha local del establecimiento. El día se
        interpreta con la zona horaria configurada en el establecimiento. No requiere JWT.
      operationId: findPublicAvailability
      security: []
      parameters:
        - name: tenantSlug
          in: path
          required: true
          description: Slug público del tenant.
          schema:
            type: string
            minLength: 2
            maxLength: 63
            pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        - name: establishmentSlug
          in: path
          required: true
          description: Slug del establecimiento dentro del tenant.
          schema:
            type: string
            minLength: 2
            maxLength: 63
            pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        - name: date
          in: query
          required: true
          description: Día local del establecimiento en formato ISO 8601 (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Disponibilidad del día solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /public/tenants/{tenantSlug}/establishments/{establishmentSlug}/reservations:
    parameters:
      - name: tenantSlug
        in: path
        required: true
        description: Slug público del tenant.
        schema:
          type: string
          minLength: 2
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
      - name: establishmentSlug
        in: path
        required: true
        description: Slug del establecimiento dentro del tenant.
        schema:
          type: string
          minLength: 2
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    post:
      tags: [public-reservations]
      summary: Crear una reserva pública
      description: |
        Crea una reserva anónima en estado `CREATED` para uno o más elementos del
        establecimiento. El tenant y el establecimiento se resuelven exclusivamente por sus
        slugs públicos. La fecha y las horas se interpretan en la zona horaria configurada
        para el establecimiento. No requiere JWT ni acepta `tenantId`, `status` ni auditoría.
      operationId: createPublicReservation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicReservationCreateRequest"
      responses:
        "201":
          description: Reserva pública creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /establishments/{establishmentId}/reservations:
    parameters:
      - name: establishmentId
        in: path
        required: true
        description: Establecimiento del tenant donde se crea la reserva.
        schema:
          type: string
          format: uuid
    post:
      tags: [reservations]
      summary: Crear una reserva interna
      description: |
        Crea una reserva en estado `CREATED` para uno o más elementos disponibles. El
        tenant y el actor se obtienen exclusivamente del JWT. Requiere rol ADMIN, MANAGER
        o STAFF.
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
      responses:
        "201":
          description: Reserva creada con todas sus asociaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /audit-logs:
    get:
      tags: [audit]
      summary: Consultar la bitácora de auditoría
      description: |
        Devuelve una página del historial inmutable del tenant autenticado, ordenada por
        `occurredAt DESC, id DESC`. Permite filtrar por recurso, evento, identificador e
        intervalo inclusivo de fechas. El tenant se obtiene exclusivamente del JWT y la
        operación requiere rol ADMIN.
      operationId: listAuditLogs
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: resourceType
          in: query
          description: Tipo del recurso auditado.
          schema:
            $ref: "#/components/schemas/AuditResourceType"
        - name: eventType
          in: query
          description: Tipo del evento de negocio.
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: resourceId
          in: query
          description: Identificador exacto del recurso auditado.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Instante mínimo inclusivo de ocurrencia.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Instante máximo inclusivo de ocurrencia.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Página de eventos del tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /reservations:
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [reservations]
      summary: Listar las reservas del tenant
      description: |
        Devuelve todas las reservas del tenant autenticado, de la más reciente a la más
        antigua. El tenant se obtiene exclusivamente del JWT: nunca viaja en la petición.

        **Techo conocido:** la respuesta es un array plano, sin paginación. Está pensada
        para métricas agregadas (totales, crecimiento semanal, reparto por estado). Si un
        tenant llega a acumular cientos de reservas, hará falta una variante paginada.
      operationId: listReservations
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Reservas del tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /people:
    get:
      tags: [people]
      summary: Buscar clientes
      description: |
        Busca personas activas del tenant autenticado por nombre, correo o teléfono.
        El tenant se obtiene exclusivamente del JWT.
      operationId: searchPeople
      parameters:
        - name: query
          in: query
          description: Texto opcional para filtrar por nombre, correo o teléfono.
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Personas activas que coinciden con la búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [people]
      summary: Registrar cliente
      description: |
        Registra una persona dentro del tenant autenticado. El identificador, el tenant y
        la auditoría los decide el backend.
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreateRequest"
      responses:
        "201":
          description: Persona registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [auth]
      summary: Iniciar sesión
      description: |
        Verifica las credenciales del usuario dentro del tenant indicado y emite
        un token de acceso JWT. Todos los rechazos de credenciales usan el mismo
        mensaje para no revelar si existen el tenant o la cuenta.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Credenciales válidas y token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [health]
      summary: Estado del servicio
      description: Endpoint de humo. Sirve para verificar que el contrato de punta a punta funciona.
      operationId: getHealth
      security: []
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: El servicio está operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      tags: [tenants]
      summary: Listar tenants de la plataforma
      description: |
        Operación exclusiva de SUPER_ADMIN. La tabla `tenant` es global de la
        plataforma (sin `tenant_id` ni RLS, por diseño — ver ADR-0004): el
        aislamiento multi-tenant NO aplica aquí y esta es la única sección de
        la API que ve todos los tenants. El backend la protege con el rol, no
        solo el frontend.
      operationId: listTenants
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: search
          in: query
          description: Filtra por nombre o slug (contiene, sin distinguir mayúsculas).
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TenantStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Página de tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [tenants]
      summary: Registrar un tenant
      description: |
        Registra una nueva empresa en la plataforma. La operación pertenece al
        Administrador de Plataforma y genera el identificador del tenant en el backend.
        El correo del administrador se usa para enviar la confirmación y no se devuelve
        como parte del recurso tenant.
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
      responses:
        "201":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Tenant creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Identificador del tenant (cadena generada por el backend).
        schema:
          type: string
          minLength: 2
          maxLength: 63

    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [tenants]
      summary: Consultar el detalle de un tenant
      description: Solo SUPER_ADMIN. 404 si no existe.
      operationId: getTenant
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Tenant solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [tenants]
      summary: Editar un tenant
      description: |
        Edición parcial: solo `name` y `status`. `slug` y `vertical` no están
        en el esquema a propósito: son inmutables por dominio (el slug vive en
        URLs públicas de login y reserva; la vertical se asigna al crear y
        condiciona el onboarding). Enviarlos queda fuera del esquema.

        `status` implementa el ciclo de vida de CU-03: ACTIVE ↔ SUSPENDED.
        NO existe DELETE: el negocio suspende, no elimina.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdateRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Tenant actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/activate:
    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [auth]
      summary: Activar la cuenta del primer ADMIN de un tenant
      description: |
        Onboarding de CU-25: el invitado abre el enlace que recibió por correo y
        define su contraseña. Público (aún no existe sesión). Jamás viaja una
        contraseña temporal ni un JWT: el enlace lleva un token opaco aleatorio
        de un solo uso con caducidad de 24 h; en el servidor solo se guarda su
        hash SHA-256.

        Errores específicos (todos `application/problem+json`):
        - `invitation-invalid`   — el token no existe o está mal formado
        - `invitation-expired`   — el token existe pero caducó
        - `invitation-used`      — el token ya se consumió
        - `password-mismatch`    — password y su confirmación difieren
        - `password-weak`        — no cumple las reglas de contraseña
      operationId: activateAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Cuenta ADMIN creada y activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [users]
      summary: Crear un usuario de staff
      description: |
        Creación de cuentas de staff (CU-25 / MAP-185). Autorización exacta:

        - **SUPER_ADMIN**: puede crear `ADMIN`, `MANAGER` o `STAFF`, y debe indicar
          el tenant destino con `tenantSlug` (su sesión pertenece al tenant técnico
          `platform`, no a un negocio).
        - **ADMIN**: solo puede crear `STAFF` y siempre dentro de su propio tenant;
          si envía `tenantSlug` distinto del suyo, recibe 403.
        - **MANAGER** y **STAFF**: 403.

        El `tenant_id` nunca se acepta como dato del cliente: sale del JWT (o del
        slug indicado por el SUPER_ADMIN, que sí puede operar cross-tenant).
        El correo es único por tenant; un duplicado responde 409. Nunca se devuelve
        ni persiste una contraseña temporal en claro, ni se genera un JWT aquí.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Usuario creado y activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /feature-flags:
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [feature-flags]
      summary: Flags evaluadas para el usuario y tenant actuales
      description: |
        Devuelve el estado de las feature flags ya evaluadas en el contexto del
        llamante (tenant, usuario, rol, país). El frontend no evalúa reglas:
        solo consume booleanos.

        Nota: para el navegador, la vía preferente es el **unleash-proxy**
        (`UNLEASH_PROXY_URL`). Este endpoint existe para diagnóstico y para
        clientes que ya están autenticados contra el backend.
      operationId: getFeatureFlags
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Mapa de flag → habilitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlags"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /demo-items:
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [demo-items]
      summary: Listar elementos de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: listDemoItems
      security: []
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Elementos del tenant de demostración
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoItem"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [demo-items]
      summary: Crear un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: createDemoItem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoItemRequest"
      responses:
        "201":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Elemento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /demo-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento
        schema:
          type: string
          format: uuid

    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [demo-items]
      summary: Obtener un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: getDemoItem
      security: []
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Elemento solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [demo-items]
      summary: Actualizar un elemento de demostración
      description: Endpoint temporal para probar el flujo CRUD completo sin autenticación JWT.
      operationId: updateDemoItem
      security: []
      requestBody:
        required: true
