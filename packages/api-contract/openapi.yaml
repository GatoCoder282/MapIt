  # ── Layout de planta (HU-4.01) ────────────────────────────────────────
  # Lectura agregada y guardado por lotes de la planta: geometría del lienzo
  # + colocación de sectores. La composición interna de cada sector viene
  # en solo-lectura (misma fila; la edición interna es PUT /sectors/{id}/layout).
  /floors/{floorId}/layout:
    parameters:
      - name: floorId
        in: path
        required: true
        description: Identificador del piso cuyo layout se consulta
        schema:
          type: string
          format: uuid
    get:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [spaces]
      summary: Obtener el layout completo de una planta
      description: |
        Lectura agregada (RN-3): planta con su geometría de lienzo, sus sectores
        colocados (colocación + dimensiones intrínsecas) y los elementos de cada
        sector en solo-lectura. Sustituye el fan-out cliente piso→sectores→elementos.
      operationId: getFloorLayout
      security: [] # Temporary
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Layout de la planta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorLayoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # Si el piso no existe o es de otro tenant
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [spaces]
      summary: Guardar el layout de una planta (por lotes)
      description: |
        Guardado transaccional (RN-7): dimensiones del lienzo + colocaciones de
        sectores en una sola operación. Cada recurso lleva el `updatedAt` que el
        cliente observó al cargar; si alguna fila cambió debajo, responde 409 con
        la lista de recursos en conflicto y no persiste nada.
      operationId: saveFloorLayout
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorLayoutUpdateRequest"
      responses:
        "200":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Layout guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorLayoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Geometría inválida o sector fuera del lienzo
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict" # updatedAt base obsoleto (concurrencia optimista)
        "500":
          $ref: "#/components/responses/ServerError"

  /floors/{floorId}/sectors:duplicate:
    parameters:
      - name: floorId
        in: path
        required: true
        description: Identificador del piso de destino
        schema:
          type: string
          format: uuid
    post:
      parameters:
        - $ref: "#/components/parameters/RequestId"
      tags: [spaces]
      summary: Duplicar un sector hacia esta planta
      description: |
        Reutilización como copia explícita (RN-5): crea un sector nuevo en esta
        planta clonando nombre (derivado), capacidad y composición interna del
        sector fuente con **identificadores nuevos** para cada elemento. No queda
        enlace entre origen y copia. El sector fuente debe pertenecer al mismo
        tenant; si no, 404 indistinguible.
      operationId: duplicateSector
      security: [] # Temporary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorDuplicateRequest"
      responses:
        "201":
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          description: Sector duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorLayoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound" # Piso destino o sector fuente inexistente/ajeno
        "409":
          $ref: "#/components/responses/Conflict" # slug derivado ya en uso
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Sectores (CU-05) ────────────────────────────────────────────────
  # `security: []` es TEMPORAL, igual que en demo-items: la autenticación JWT
