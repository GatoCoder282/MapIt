# =============================================================
#  Sistema COMPLETO contenerizado — ensayo de despliegue.
#  Levantar con:  pnpm infra:full
#
#  El despliegue aún no está previsto (todo en localhost), pero
#  validamos desde ahora que todo corre en contenedores. Así no
#  hay sorpresas al final del semestre.
# =============================================================

name: ${COMPOSE_PROJECT_NAME:-mapit}

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: mapit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      unleash:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Dentro de la red de Docker se usan los nombres de servicio y el puerto interno.
      # DB_URL alimenta tanto el datasource de runtime como Flyway (application.yml).
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mapit}
      # Flyway/DDL queda con el owner `mapit`; el runtime usa `mapit_app` (MAP-175).
      POSTGRES_USER: ${POSTGRES_USER:-mapit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local}
      MAPIT_APP_DB_USER: ${MAPIT_APP_DB_USER:-mapit_app}
      MAPIT_APP_DB_PASSWORD: ${MAPIT_APP_DB_PASSWORD:-changeme_local}
      # Bootstrap del SUPER_ADMIN (CU-25); vacío = no se crea.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@mapit.local}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:-Super Administrador}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      MAPIT_JWT_SECRET: ${JWT_SECRET}
      MAPIT_JWT_ISSUER: ${JWT_ISSUER:-mapit}
      MAPIT_JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MIN:-15}
      MAPIT_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
      MAPIT_UNLEASH_URL: http://unleash:4242/api
      MAPIT_UNLEASH_API_TOKEN: ${UNLEASH_API_TOKEN:-default:development.unleash-insecure-api-token}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  console:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP_NAME: console
    container_name: mapit-console
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-4200}:8080"

  public-web:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP_NAME: public-web
    container_name: mapit-public-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_WEB_PORT:-4300}:8080"
