# Solo categorías conocidas: nunca URI, query, referer, IP ni user-agent.
map $uri $mapit_resource {
  default "spa";
  /assets/config.json "runtime_config";
  ~*\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ "static_asset";
}

map $status $mapit_level {
  default "INFO";
  ~^4 "WARN";
  ~^5 "ERROR";
}

map $request_method $mapit_method {
  default "OTHER";
  GET "GET";
  HEAD "HEAD";
  POST "POST";
  PUT "PUT";
  PATCH "PATCH";
  DELETE "DELETE";
  OPTIONS "OPTIONS";
}

log_format mapit_json escape=json
  '{"@timestamp":"$time_iso8601","service":"mapit-web-server",'
  '"environment":"docker","level":"$mapit_level",'
  '"event":"http.request.completed","method":"$mapit_method",'
  '"operation":"$mapit_resource","status":$status,"duration_seconds":$request_time}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout mapit_json;
  # Nginx no permite sanitizar error_log: sus errores por petición incluyen la URL.
  # El access log conserva el estado de cada fallo; errores de arranque siguen en stderr.
  error_log /dev/null;

  # Angular es una SPA: cualquier ruta desconocida debe devolver index.html
  # para que el router del cliente la resuelva (si no, F5 en /reservas da 404).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La config de runtime NO se cachea: es lo que permite usar la misma
  # imagen en dev y en despliegue cambiando solo este archivo.
  location = /assets/config.json {
    expires -1;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
