server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular es una SPA: cualquier ruta desconocida debe devolver index.html
  # para que el router del cliente la resuelva (si no, F5 en /reservas da 404).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La config de runtime NO se cachea: es lo que permite usar la misma
  # imagen en dev y en despliegue cambiando solo este archivo.
  location = /assets/config.json {
    expires -1;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
